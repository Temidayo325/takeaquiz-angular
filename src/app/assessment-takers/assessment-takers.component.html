
<app-dashboard-header></app-dashboard-header>
<div class="mx-12">
     <h1>Welcome to AssessmentTakersComponent</h1>

     <div class="flex justify-end gap-5 items-center py-3 my-3">
          <button class="px-10 py-3 border-none shadow-xl cursor-pointer bg-blue-800 text-white disabled:text-black disabled:shadow-none disabled:bg-gray-300 disabled:border-gray-200 disabled:cursor-not-allowed hover:shadow-2xl" [disabled]="students.prev_page_url == null" (click)="nextPageAction('prev')">Prev</button>
          <button class="px-10 py-3 border-none shadow-xl cursor-pointer bg-blue-800 text-white disabled:text-black disabled:shadow-none disabled:bg-gray-300 disabled:border-gray-200 disabled:cursor-not-allowed hover:shadow-2xl" [disabled]="students.next_page_url == null" (click)="nextPageAction('next')">Next</button>
     </div>
     <div class="relative overflow-x-auto shadow-md sm:rounded-lg">
         <table class="w-full text-sm text-left rtl:text-right text-gray-500 dark:text-gray-400">
             <thead class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-400">
                 <tr>
                     <!-- <th scope="col" class="px-6 py-3">
                         Name
                     </th> -->
                     <th scope="col" class="px-6 py-3">
                         Matric name
                     </th>
                     <th scope="col" class="px-6 py-3">
                         Score
                     </th>
                     <th scope="col" class="px-6 py-3">
                         Date
                     </th>
                     <th scope="col" class="px-6 py-3 ">
                         <span class="sr-only cursor-pointer">View script</span>
                     </th>
                 </tr>
             </thead>
             <tbody>
                 <tr class="bg-white border-b dark:bg-gray-800 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-600" *ngFor="let student of students.data; index as i; trackBy: trackByFn">
                     <th scope="row" class="px-6 py-4 font-medium text-gray-900 whitespace-nowrap dark:text-white">
                         {{student.matric}}
                     </th>
                     <td class="px-6 py-4">
                         {{student.score}}
                     </td>
                     <td class="px-6 py-4">
                         {{student.created_at}}
                     </td>
                     <td class="px-6 py-4 text-right">
                         <p href="#" class="font-medium text-blue-600 dark:text-blue-500 hover:underline cursor-pointer" (click)="scripts(student.test_script)">View script</p>
                     </td>
                 </tr>
             </tbody>
         </table>
     </div>

</div>
